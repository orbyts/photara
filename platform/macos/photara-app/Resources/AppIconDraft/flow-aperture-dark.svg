<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Circular flow mark — dark draft</title>
  <desc id="description">Three luminous blades form a rounded triangular silhouette and turn around a smooth aperture-shaped opening. The surrounding canvas is transparent.</desc>
  <defs>
    <linearGradient id="blue" x1="160" y1="110" x2="369" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#625de2"/>
      <stop offset=".29" stop-color="#5b83ef"/>
      <stop offset=".65" stop-color="#6eb8ff"/>
      <stop offset="1" stop-color="#d1fbff"/>
    </linearGradient>
    <linearGradient id="peach" x1="160" y1="110" x2="369" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7466ce"/>
      <stop offset=".31" stop-color="#b081de"/>
      <stop offset=".68" stop-color="#efafc6"/>
      <stop offset="1" stop-color="#ffe0a5"/>
    </linearGradient>
    <linearGradient id="violet" x1="160" y1="110" x2="369" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3e84d8"/>
      <stop offset=".36" stop-color="#65aaff"/>
      <stop offset=".7" stop-color="#9a8de7"/>
      <stop offset="1" stop-color="#d9a9e7"/>
    </linearGradient>
    <path id="blade" d="M 126,229 C 144,165 200,111 266,96 C 321,83 371,99 390,132 C 408,163 399,194 376,211 C 353,227 323,220 308,199 C 294,180 282,155 254,147 C 210,134 158,168 126,229 Z"/>
    <mask id="right-behind-top" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#blade" fill="#000"/>
    </mask>
    <mask id="left-behind-right" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#blade" transform="rotate(120 256 256)" fill="#000"/>
    </mask>
  </defs>

  <g>
    <use href="#blade" fill="url(#blue)"/>
    <g mask="url(#right-behind-top)"><use href="#blade" fill="url(#peach)" transform="rotate(120 256 256)"/></g>
    <g mask="url(#left-behind-right)"><use href="#blade" fill="url(#violet)" transform="rotate(240 256 256)"/></g>
  </g>
</svg>
