[package]
name = "photara-library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral user Library contracts and local SQLite adapter for Photara."

[dependencies]
rusqlite.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
photara-core = { path = "../photara-core" }
photara-store = { path = "../photara-store" }
storexa = "=0.2.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["sync"] }
unicode-normalization = "=0.1.24"
caseless = "=0.2.2"
url = "2.5"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
