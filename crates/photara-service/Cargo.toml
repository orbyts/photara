[package]
name = "photara-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Generation Two PostgreSQL service boundary for Photara."

[dependencies]
photara-core = { path = "../photara-core" }
photara-library = { path = "../photara-library" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
uuid.workspace = true
storexa = "=0.2.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
