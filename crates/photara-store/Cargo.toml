[package]
name = "photara-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistence boundaries and adapters for Photara Core."

[features]
controlled-disposable = []

[dependencies]
photara-core = { path = "../photara-core" }
photara-node-sdk = { path = "../photara-node-sdk" }
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10 gates ARM SHA instructions behind asm, with runtime detection and
# the same portable fallback. This changes neither digest nor package bytes.
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
