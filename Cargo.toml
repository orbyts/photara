[package]
name = "photara"
version = "0.0.2"
edition = "2024"
description = "A photography workflow and publishing tool."
license = "MIT"
repository = "https://github.com/orbyts/photara"
homepage = "https://github.com/orbyts/photara"
readme = "README.md"
keywords = ["photography", "workflow", "lightroom", "publishing"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "json"] }
storexa = "0.1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
