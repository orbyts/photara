[package]
name = "photara"
version = "0.1.0"
edition = "2024"
description = "A photography workflow and publishing tool."
license = "MIT"
repository = "https://github.com/orbyts/photara"
homepage = "https://github.com/orbyts/photara"
readme = "README.md"
keywords = ["photography", "workflow", "lightroom", "publishing"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
keyring = "4.1.5"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "sqlite", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "json", "chrono"] }
storexa = "0.1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
